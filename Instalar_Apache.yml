---
- name: Instalar Apache server
  hosts: all

  tasks:
  - name: Instalar ultima versión de Apache 
    yum:
      name: httpd
      state: latest

  - name: Instalar ultima versión de firewalld
    yum:
      name: firewalld
      state: latest

  - name:  Habilitando y arrancando firewalld
    service:
      name: firewalld
      enabled: true
      state: started

  - name: Permitiendo el servicio http firewalld
    firewalld:
      service: http
      permanent: true
      state: enabled
      immediate: yes

  - name: Habilitando y arrancando Apache
    service:
      name: httpd
      enabled: true
      state: started
