---

- hosts: all
  vars:
    redes_ssh_permitidas:
      - 192.168.122.0/24
      - 10.10.10.0/24
    servicios_innecesarios:
      - postfix
      - telnet
    software_innecesario:
      - tcpdump
      - nmap-ncat
      - wpa_supplicant
	  
  tasks:
    - name: Pacheado completo
      package:
        name: '*'
        state: latest

    - name: Agregar a grupo admin
      group:
        name: admin
        state: present

    - name: Agregar usuario local 
      user:
        name: admin
        group: admin
        shell: /bin/bash
        home: /home/admin
        create_home: yes
        state: present

    - name: Agregar llave publica SSH a usuario
      authorized_key:
        user: admin
        key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        state: present

    - name: Regla de sudoer a usuario local
      copy:
        dest: /etc/sudoers.d/admin
        src: etc/sudoers.d/admin
        owner: root
        group: root
        mode: 0440
        validate: /usr/sbin/visudo -csf %s

    - name: Agregar configuracion SSH hardened 
      copy:
        dest: /etc/ssh/sshd_config
        src: etc/ssh/sshd_config
        owner: root
        group: root
        mode: 0600
      notify: Reload SSH

    - name: Agregar puerto SSH a zona interna
      firewalld:
        zone: internal
        service: ssh
        state: enabled
        immediate: yes
        permanent: yes

    - name: Agregar redes permitidas a zona interna
      firewalld:
        zone: internal
        source: "{{ item }}"
        state: enabled
        immediate: yes
        permanent: yes
      with_items: "{{ redes_ssh_permitidas }}"

    - name: desabilitar ssh para la zona publica
      firewalld:
        zone: public
        service: ssh
        state: disabled
        immediate: yes
        permanent: yes

    - name: Remover paquetes no deseados
      package:
        name: "{{ software_innecesario }}"
        state: absent

    - name: Detener y deshabilitar servicios innecesarios 
      service:
        name: "{{ item }}"
        state: stopped
        enabled: no
      with_items: "{{ servicios_innecesarios }}"
      ignore_errors: yes

    - name: Setear mensaje del dia
      copy:
        dest: /etc/motd
        src: etc/motd
        owner: root
        group: root
        mode: 0644

    - name: Setear un login banner
      copy:
        dest: "{{ item }}"
        src: etc/issue
        owner: root
        group: root
        mode: 0644
      with_items:
        - /etc/issue
        - /etc/issue.net

  handlers:
    - name: Reload SSH
      service:
        name: sshd
        state: reloaded
		
		
