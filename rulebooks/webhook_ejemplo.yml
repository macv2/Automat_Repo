---
- name: Escuchar eventos en un webhook
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 
  rules:
    - name: Saludo
      condition: event.payload.event_name == 'Hello'
      action:
        run_job_template:
          name: 
          organization: Default
          job_args:
            extra_vars:
              hosts_update: "{{ event.payload.host_host }}"
